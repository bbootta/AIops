name: ir-deck run

# 디캠프 9기 IR 채널(C0BK4SCJUBV)의 업로드·명령을 처리한다. 설정 절차: tools/ir_deck/README.md
# 상태(버전 레지스트리)는 Slack에 봇 비공개 파일로 둔다. 공개 저장소에는 아무것도 쓰지 않는다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "첫 실행: 상태 파일과 현황 캔버스를 새로 만든다"
        type: boolean
        default: false

concurrency:
  group: ir-deck-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.IR_DECK_ENABLED == 'true' }}
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      IR_CHANNEL: C0BK4SCJUBV
      IR_MAIN_CANVAS: F0C6JDHTUJJ
      IR_STATE_PATH: .ir_deck/state.json
      IR_BOOTSTRAP: ${{ inputs.bootstrap && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/ir_deck/requirements.txt
      - name: Process channel
        id: process
        env:
          IR_PDF_READY: "0"  # 취합 명령을 만나면 멈춘다. 아래 단계가 PDF 도구를 설치하고 이어서 처리한다
        run: python tools/ir_deck/run.py
      - name: Install LibreOffice and fonts
        if: steps.process.outputs.needs_pdf == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-noto-cjk
          curl -fsSL -o /tmp/pretendard.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          mkdir -p ~/.fonts && unzip -q -o /tmp/pretendard.zip 'public/static/*.otf' -d /tmp/pretendard
          cp /tmp/pretendard/public/static/*.otf ~/.fonts/ && fc-cache -f
      - name: Process build requests
        if: steps.process.outputs.needs_pdf == 'true'
        run: python tools/ir_deck/run.py
