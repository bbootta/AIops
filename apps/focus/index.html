<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus — 뽀모도로 + 할 일</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --line: #2b303d;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #ff6b5b;
    --break: #45c08a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  a.back { color: var(--muted); text-decoration: none; font-size: 14px; align-self: flex-start; }
  a.back:hover { color: var(--text); }
  .card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 24px;
  }
  .modes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .modes button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .modes button[aria-pressed="true"] { background: var(--line); color: var(--text); }
  #clock {
    font-size: 76px; font-weight: 200; text-align: center;
    font-variant-numeric: tabular-nums; letter-spacing: -2px; margin: 8px 0 4px;
  }
  #label { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .controls { display: flex; gap: 10px; }
  .controls button {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: var(--line); color: var(--text);
  }
  #startBtn { background: var(--accent); color: #16181d; }
  body.break #startBtn { background: var(--break); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
  #taskForm { display: flex; gap: 8px; margin-bottom: 14px; }
  #taskInput {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px;
  }
  #taskForm button {
    padding: 0 16px; border-radius: 8px; border: none;
    background: var(--line); color: var(--text); cursor: pointer; font-size: 18px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li.active { background: rgba(255,107,91,.09); border-radius: 6px; }
  li .title { flex: 1; cursor: pointer; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li .tomatoes { font-size: 12px; color: var(--muted); white-space: nowrap; }
  li .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  li .del:hover { color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 0; }
</style>
</head>
<body>
<a class="back" href="../index.html">← apps</a>

<div class="card">
  <div class="modes">
    <button data-mode="focus" aria-pressed="true">집중 25분</button>
    <button data-mode="short">휴식 5분</button>
    <button data-mode="long">긴 휴식 15분</button>
  </div>
  <div id="clock">25:00</div>
  <div id="label">시작할 준비 완료</div>
  <div class="controls">
    <button id="startBtn">시작</button>
    <button id="resetBtn">리셋</button>
  </div>
</div>

<div class="card">
  <h2>할 일</h2>
  <form id="taskForm">
    <input id="taskInput" placeholder="지금 집중할 일은?" autocomplete="off">
    <button type="submit" aria-label="추가">+</button>
  </form>
  <ul id="taskList"></ul>
  <p class="hint">할 일을 클릭하면 활성 작업이 됩니다. 집중 세션을 마치면 🍅가 하나 쌓여요.</p>
</div>

<script>
const DURATIONS = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
const LABELS = { focus: '집중', short: '짧은 휴식', long: '긴 휴식' };

const clockEl = document.getElementById('clock');
const labelEl = document.getElementById('label');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const modeBtns = [...document.querySelectorAll('.modes button')];
const taskForm = document.getElementById('taskForm');
const taskInput = document.getElementById('taskInput');
const taskList = document.getElementById('taskList');

let mode = 'focus';
let remaining = DURATIONS.focus;
let deadline = null;   // 실행 중이면 종료 시각(ms), 멈춰 있으면 null
let ticker = null;

let tasks = load('focus.tasks', []);
let activeId = load('focus.active', null);

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch { return fallback; }
}
function save() {
  localStorage.setItem('focus.tasks', JSON.stringify(tasks));
  localStorage.setItem('focus.active', JSON.stringify(activeId));
}

/* ---------- 타이머 ---------- */

function secondsLeft() {
  return deadline ? Math.max(0, Math.round((deadline - Date.now()) / 1000)) : remaining;
}

function format(s) {
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function render() {
  const s = secondsLeft();
  clockEl.textContent = format(s);
  document.title = (deadline ? format(s) + ' · ' : '') + LABELS[mode] + ' — Focus';
  startBtn.textContent = deadline ? '일시정지' : (s === DURATIONS[mode] ? '시작' : '계속');
  document.body.classList.toggle('break', mode !== 'focus');
}

function tick() {
  if (secondsLeft() > 0) { render(); return; }
  stop();
  remaining = 0;
  render();
  complete();
}

function start() {
  if (deadline) return;
  if (remaining === 0) remaining = DURATIONS[mode];
  deadline = Date.now() + remaining * 1000;
  ticker = setInterval(tick, 250);
  render();
}

function stop() {
  if (deadline) remaining = secondsLeft();
  clearInterval(ticker);
  ticker = null;
  deadline = null;
}

function setMode(next) {
  stop();
  mode = next;
  remaining = DURATIONS[mode];
  modeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  labelEl.textContent = LABELS[mode] + ' 준비 완료';
  render();
}

function complete() {
  beep();
  if (mode === 'focus') {
    const task = tasks.find(t => t.id === activeId);
    if (task) { task.tomatoes++; save(); renderTasks(); }
    labelEl.textContent = '집중 완료! 쉬어가세요.';
  } else {
    labelEl.textContent = '휴식 끝. 다시 집중할까요?';
  }
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  } catch { /* 소리는 없어도 동작에 지장 없음 */ }
}

startBtn.addEventListener('click', () => {
  if (deadline) { stop(); render(); } else { start(); }
});
resetBtn.addEventListener('click', () => setMode(mode));
modeBtns.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

/* ---------- 할 일 ---------- */

function renderTasks() {
  taskList.innerHTML = '';
  for (const task of tasks) {
    const li = document.createElement('li');
    li.className = (task.done ? 'done ' : '') + (task.id === activeId ? 'active' : '');

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = task.done;
    box.addEventListener('change', () => { task.done = box.checked; save(); renderTasks(); });

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = task.title;
    title.addEventListener('click', () => {
      activeId = activeId === task.id ? null : task.id;
      save(); renderTasks();
    });

    const tomatoes = document.createElement('span');
    tomatoes.className = 'tomatoes';
    tomatoes.textContent = '🍅'.repeat(task.tomatoes);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = '삭제';
    del.addEventListener('click', () => {
      tasks = tasks.filter(t => t.id !== task.id);
      if (activeId === task.id) activeId = null;
      save(); renderTasks();
    });

    li.append(box, title, tomatoes, del);
    taskList.append(li);
  }
}

taskForm.addEventListener('submit', e => {
  e.preventDefault();
  const title = taskInput.value.trim();
  if (!title) return;
  const task = { id: String(Date.now()), title, done: false, tomatoes: 0 };
  tasks.push(task);
  if (activeId === null) activeId = task.id;
  taskInput.value = '';
  save(); renderTasks();
});

renderTasks();
render();
</script>
</body>
</html>
