<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호프: 마지막 거리 — 3D 슈팅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  #game { position: fixed; inset: 0; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 28px; height: 28px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(230,230,220,0.9);
    box-shadow: 0 0 3px rgba(0,0,0,0.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%);
    clip-path: polygon(0 0, 100% 0, 100% 32%, 0 32%, 0 68%, 100% 68%, 100% 100%, 0 100%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%);
    clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%, 68% 0, 100% 0, 100% 100%, 68% 100%); }

  #ammoPanel {
    position: absolute; right: 28px; bottom: 28px;
    background: rgba(12,12,12,0.75); border: 1px solid rgba(160,160,150,0.5);
    border-radius: 4px; padding: 10px 16px; display: flex; align-items: center; gap: 14px;
    color: #e8e6dd;
  }
  #ammoPanel canvas { display: block; }
  #ammoCount { font-size: 30px; font-weight: bold; letter-spacing: 1px; line-height: 1; }
  #ammoReserve { font-size: 14px; color: #9a978c; }
  #reloadHint { position: absolute; right: 32px; bottom: 92px; color: #ffb84d; font-size: 14px;
    text-shadow: 0 0 4px #000; display: none; }

  #healthWrap { position: absolute; left: 28px; bottom: 28px; width: 220px; }
  #healthLabel { color: #cfcdc2; font-size: 12px; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }
  #healthBar { height: 10px; background: rgba(0,0,0,0.6); border: 1px solid rgba(160,160,150,0.5); border-radius: 3px; overflow: hidden; }
  #healthFill { height: 100%; width: 100%; background: linear-gradient(90deg, #b8452e, #d9863a); transition: width 0.15s; }

  #waveInfo { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #e8e6dd; text-align: center; text-shadow: 0 1px 3px #000; }
  #waveInfo .wave { font-size: 20px; font-weight: bold; letter-spacing: 4px; }
  #waveInfo .score { font-size: 13px; color: #b5b2a5; margin-top: 2px; }

  #waveBanner { position: absolute; top: 34%; left: 50%; transform: translateX(-50%);
    color: #f0ede2; font-size: 42px; font-weight: bold; letter-spacing: 10px;
    text-shadow: 0 0 18px rgba(255,140,60,0.55), 0 2px 6px #000; opacity: 0; transition: opacity 0.5s; }

  #damageFlash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(180,20,10,0.55) 100%);
    opacity: 0; transition: opacity 0.4s; }
  #hitMarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(45deg);
    width: 18px; height: 18px; opacity: 0; }
  #hitMarker::before, #hitMarker::after { content:''; position:absolute; background:#ff5a3c; box-shadow:0 0 4px #000; }
  #hitMarker::before { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%);
    clip-path: polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%); }
  #hitMarker::after { top:50%; left:0; height:2px; width:100%; transform:translateY(-50%);
    clip-path: polygon(0 0,30% 0,30% 100%,0 100%,70% 0,100% 0,100% 100%,70% 100%); }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(30,26,22,0.88), rgba(5,4,3,0.96));
    color: #e8e6dd; z-index: 10;
  }
  .overlay h1 { font-size: 46px; letter-spacing: 14px; margin-bottom: 6px;
    text-shadow: 0 0 24px rgba(255,140,60,0.5); }
  .overlay .sub { color: #b5b2a5; font-size: 15px; margin-bottom: 34px; letter-spacing: 2px; }
  .overlay .controls { font-size: 14px; color: #cfcdc2; line-height: 2; margin-bottom: 36px; }
  .overlay .controls b { color: #ffb84d; font-weight: bold; }
  .overlay button {
    pointer-events: auto; cursor: pointer; font-family: inherit;
    font-size: 18px; letter-spacing: 6px; padding: 14px 46px;
    color: #f0ede2; background: rgba(180,70,40,0.25); border: 1px solid #d9863a; border-radius: 4px;
  }
  .overlay button:hover { background: rgba(217,134,58,0.35); }
  #gameoverOverlay { display: none; }
  #gameoverOverlay h1 { color: #e05c3a; }
  #finalScore { font-size: 18px; margin-bottom: 30px; color: #cfcdc2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="damageFlash"></div>
  <div id="crosshair"></div>
  <div id="hitMarker"></div>
  <div id="waveInfo">
    <div class="wave">WAVE <span id="waveNum">1</span></div>
    <div class="score">사살 <span id="score">0</span></div>
  </div>
  <div id="waveBanner"></div>
  <div id="healthWrap">
    <div id="healthLabel">체력</div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div id="ammoPanel">
    <canvas id="gunIcon" width="96" height="34"></canvas>
    <div>
      <div id="ammoCount">30</div>
      <div id="ammoReserve">/ 90</div>
    </div>
  </div>
  <div id="reloadHint">R 키로 재장전</div>
</div>

<div id="startOverlay" class="overlay">
  <h1>호 프</h1>
  <div class="sub">— 마지막 거리 —</div>
  <div class="controls">
    <b>W A S D</b> 이동&nbsp;&nbsp;·&nbsp;&nbsp;<b>마우스</b> 조준&nbsp;&nbsp;·&nbsp;&nbsp;<b>클릭</b> 사격<br>
    <b>R</b> 재장전&nbsp;&nbsp;·&nbsp;&nbsp;<b>SHIFT</b> 달리기<br><br>
    폐허가 된 거리로 그림자들이 몰려온다. 살아남아라.
  </div>
  <button id="startBtn">작 전 개 시</button>
</div>

<div id="gameoverOverlay" class="overlay">
  <h1>작 전 실 패</h1>
  <div class="sub">그림자에게 잡혔다…</div>
  <div id="finalScore"></div>
  <button id="restartBtn">재 투 입</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/postprocessing.js"></script>
<script>
'use strict';

// ============================================================
// 호프: 마지막 거리 — 영화 '호프' 시가전 장면 기반 3D FPS
// 시네마틱 렌더링: ACES 톤매핑 + 블룸 + 필름 그레인/비네트
// ============================================================

const STREET_LENGTH = 220;
const STREET_WIDTH = 14;
const PLAYER_HEIGHT = 1.7;

// ---------- Renderer / Scene ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb3a488, 0.0105);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 700);
camera.position.set(0, PLAYER_HEIGHT, -6);

// ---------- Lights (hazy afternoon sun through dust) ----------
scene.add(new THREE.HemisphereLight(0xd8ccb2, 0x55503f, 0.8));
const sun = new THREE.DirectionalLight(0xf5e3c2, 1.0);
sun.position.set(-38, 55, -70);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 260;
sun.shadow.bias = -0.0004;
scene.add(sun);

// ---------- Sky dome with hazy sun glow ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(450, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { sunDir: { value: sun.position.clone().normalize() } },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 sunDir;
      void main() {
        float h = clamp(vDir.y, 0.0, 1.0);
        vec3 zenith = vec3(0.55, 0.52, 0.45);
        vec3 horizon = vec3(0.80, 0.71, 0.56);
        vec3 col = mix(horizon, zenith, pow(h, 0.65));
        float s = max(dot(normalize(vDir), sunDir), 0.0);
        col += vec3(1.0, 0.85, 0.6) * (pow(s, 24.0) * 0.5 + pow(s, 3.0) * 0.18);
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

// ============================================================
// Canvas texture helpers — weathered concrete, grime, streaks
// ============================================================
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// fine speckle noise (light + dark) — makes flat fills read as material
function speckle(ctx, w, h, n, dark, light) {
  for (let i = 0; i < n; i++) {
    const s = 1 + Math.random() * 3;
    ctx.fillStyle = Math.random() < 0.5
      ? `rgba(30,26,20,${Math.random() * dark})`
      : `rgba(255,248,230,${Math.random() * light})`;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
}
function grime(ctx, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = `rgba(40,35,28,${Math.random() * alpha})`;
    const s = 2 + Math.random() * 16;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s * (0.4 + Math.random()));
  }
}
// vertical water/rust streaks below a point
function streaks(ctx, x, y, width, len, alpha, rusty) {
  const n = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const sx = x + Math.random() * width;
    const sl = len * (0.4 + Math.random() * 0.6);
    const g = ctx.createLinearGradient(0, y, 0, y + sl);
    const c = rusty ? '96,58,30' : '38,34,28';
    g.addColorStop(0, `rgba(${c},${alpha})`);
    g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(sx, y, 1.5 + Math.random() * 2.5, sl);
  }
}

// ---------- road texture ----------
const roadTex = makeCanvas(512, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#565349'; ctx.fillRect(0, 0, w, h);
  speckle(ctx, w, h, 9000, 0.35, 0.10);
  // repair patches (slightly different tone)
  for (let i = 0; i < 7; i++) {
    ctx.fillStyle = `rgba(${40 + Math.random() * 20 | 0},${38 + Math.random() * 18 | 0},${32 + Math.random() * 16 | 0},0.55)`;
    const pw = 60 + Math.random() * 140, ph = 40 + Math.random() * 120;
    ctx.fillRect(Math.random() * (w - pw), Math.random() * (h - ph), pw, ph);
  }
  // oil stains
  for (let i = 0; i < 5; i++) {
    const ox = Math.random() * w, oy = Math.random() * h, r = 20 + Math.random() * 50;
    const g = ctx.createRadialGradient(ox, oy, 2, ox, oy, r);
    g.addColorStop(0, 'rgba(20,18,15,0.5)'); g.addColorStop(1, 'rgba(20,18,15,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, r, 0, 7); ctx.fill();
  }
  // faded, broken center line
  for (let y = 0; y < h; y += 128) {
    ctx.fillStyle = `rgba(210,195,150,${0.2 + Math.random() * 0.25})`;
    ctx.fillRect(w / 2 - 8, y + Math.random() * 10, 16, 66);
    // chipped bits
    ctx.fillStyle = '#565349';
    for (let k = 0; k < 5; k++) ctx.fillRect(w / 2 - 8 + Math.random() * 16, y + Math.random() * 70, 4, 5);
  }
  // cracks
  ctx.strokeStyle = 'rgba(28,26,22,0.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    ctx.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    ctx.moveTo(x, y);
    for (let j = 0; j < 7; j++) { x += (Math.random() - 0.5) * 70; y += Math.random() * 50; ctx.lineTo(x, y); }
    ctx.stroke();
  }
  // dirt build-up at road edges
  for (const ex of [0, w - 40]) {
    const g = ctx.createLinearGradient(ex, 0, ex + 40, 0);
    if (ex === 0) { g.addColorStop(0, 'rgba(90,80,62,0.5)'); g.addColorStop(1, 'rgba(90,80,62,0)'); }
    else { g.addColorStop(0, 'rgba(90,80,62,0)'); g.addColorStop(1, 'rgba(90,80,62,0.5)'); }
    ctx.fillStyle = g; ctx.fillRect(ex, 0, 40, h);
  }
});
roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
roadTex.repeat.set(1, 10);

// ---------- sidewalk texture ----------
const walkTex = makeCanvas(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#847b6c'; ctx.fillRect(0, 0, w, h);
  speckle(ctx, w, h, 5000, 0.3, 0.12);
  ctx.strokeStyle = 'rgba(48,43,36,0.6)'; ctx.lineWidth = 4;
  for (let x = 0; x <= w; x += 128) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y <= h; y += 128) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  // broken slab corners
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = 'rgba(52,47,40,0.5)';
    const bx = Math.floor(Math.random() * 4) * 128, by = Math.floor(Math.random() * 4) * 128;
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.lineTo(bx + 20 + Math.random() * 40, by); ctx.lineTo(bx, by + 20 + Math.random() * 40);
    ctx.closePath(); ctx.fill();
  }
  grime(ctx, w, h, 260, 0.22);
});
walkTex.wrapS = walkTex.wrapT = THREE.RepeatWrapping;
walkTex.repeat.set(2, 30);

// ---------- awning canvas texture ----------
const awningTex = makeCanvas(256, 128, (ctx, w, h) => {
  const cols = ['#8a3f34', '#e0d6bf'];
  for (let x = 0, i = 0; x < w; x += 32, i++) {
    ctx.fillStyle = cols[i % 2]; ctx.fillRect(x, 0, 32, h);
  }
  grime(ctx, w, h, 120, 0.3);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,250,235,0.25)'); g.addColorStop(1, 'rgba(30,25,20,0.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
});

// ============================================================
// Facade textures — weathered Korean shopfronts (cached set)
// ============================================================
const SIGNS = [
  ['슬기전자', '#1a2f5c', '#f2ead8'], ['서울식당', '#7a1f1a', '#f7e9c8'],
  ['희망약국', '#175c33', '#f2f0e4'], ['대성상회', '#5c3a14', '#f0e6cf'],
  ['호프사진관', '#22343f', '#e8e2d0'], ['금성다방', '#6b213f', '#f2e3d4'],
  ['제일이발관', '#14425c', '#eef0e2'], ['평화철물', '#3f3f22', '#ece6d2'],
];
const FLOOR_PX = 256;
const facadeCache = new Map();

function facade(floors, seed) {
  const key = floors + ':' + seed;
  if (facadeCache.has(key)) return facadeCache.get(key);

  const W = 512, H = FLOOR_PX * (floors + 1);
  const windows = []; // {u, v} centers of upper-floor windows (for AC units)
  const tex = makeCanvas(W, H, (ctx, w, h) => {
    // concrete base with tonal variation
    const bases = ['#a89d87', '#b1a289', '#9c9280', '#b5aa93'];
    ctx.fillStyle = bases[seed % 4]; ctx.fillRect(0, 0, w, h);
    speckle(ctx, w, h, 7000, 0.22, 0.12);
    // large uneven weather patches
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = `rgba(70,62,50,${0.05 + Math.random() * 0.12})`;
      const pw = 80 + Math.random() * 200, ph = 60 + Math.random() * 180;
      ctx.fillRect(Math.random() * w - 40, Math.random() * h - 40, pw, ph);
    }

    // ---- upper floors ----
    for (let f = 0; f < floors; f++) {
      const y0 = FLOOR_PX * f;
      // floor ledge line
      ctx.fillStyle = 'rgba(60,54,44,0.55)';
      ctx.fillRect(0, y0 + FLOOR_PX - 6, w, 6);
      ctx.fillStyle = 'rgba(255,250,235,0.18)';
      ctx.fillRect(0, y0 + FLOOR_PX - 10, w, 3);
      for (let i = 0; i < 3; i++) {
        const x0 = 48 + i * 152, wx = 112, y1 = y0 + 52, hy = 140;
        const broken = (seed * 7 + f * 3 + i) % 6 === 0;
        const boarded = (seed * 5 + f * 2 + i) % 7 === 0;
        // sill shadow + sill
        ctx.fillStyle = 'rgba(40,36,30,0.5)'; ctx.fillRect(x0 - 6, y1 + hy, wx + 12, 8);
        ctx.fillStyle = '#8d8371'; ctx.fillRect(x0 - 8, y1 + hy - 4, wx + 16, 8);
        // frame
        ctx.fillStyle = '#6f695c'; ctx.fillRect(x0 - 5, y1 - 5, wx + 10, hy + 10);
        if (boarded) {
          ctx.fillStyle = '#5e4c37'; ctx.fillRect(x0, y1, wx, hy);
          ctx.strokeStyle = 'rgba(30,24,16,0.7)'; ctx.lineWidth = 3;
          for (let b = 0; b < 5; b++) {
            ctx.strokeRect(x0 + 2, y1 + b * (hy / 5) + 2, wx - 4, hy / 5 - 4);
          }
        } else {
          // glass with vertical sky reflection gradient
          const g = ctx.createLinearGradient(0, y1, 0, y1 + hy);
          g.addColorStop(0, '#4a5152'); g.addColorStop(0.5, '#2b3134'); g.addColorStop(1, '#1d2124');
          ctx.fillStyle = g; ctx.fillRect(x0, y1, wx, hy);
          // mullions
          ctx.strokeStyle = '#7b7466'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(x0 + wx / 2, y1); ctx.lineTo(x0 + wx / 2, y1 + hy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x0, y1 + hy * 0.45); ctx.lineTo(x0 + wx, y1 + hy * 0.45); ctx.stroke();
          // diagonal reflection streak
          ctx.fillStyle = 'rgba(215,205,180,0.10)';
          ctx.beginPath(); ctx.moveTo(x0 + 8, y1 + hy); ctx.lineTo(x0 + 48, y1); ctx.lineTo(x0 + 72, y1); ctx.lineTo(x0 + 28, y1 + hy);
          ctx.closePath(); ctx.fill();
          if (broken) {
            ctx.fillStyle = '#131518';
            ctx.beginPath(); ctx.moveTo(x0 + 12, y1 + 14); ctx.lineTo(x0 + 78, y1 + 36);
            ctx.lineTo(x0 + 44, y1 + 108); ctx.lineTo(x0 + 8, y1 + 70); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(230,225,210,0.5)'; ctx.lineWidth = 1.5;
            for (let k = 0; k < 5; k++) {
              ctx.beginPath(); ctx.moveTo(x0 + 44 + (Math.random() - 0.5) * 20, y1 + 60 + (Math.random() - 0.5) * 20);
              ctx.lineTo(x0 + 44 + (Math.random() - 0.5) * 90, y1 + 60 + (Math.random() - 0.5) * 100); ctx.stroke();
            }
          }
        }
        // water streaks under sill
        streaks(ctx, x0 - 4, y1 + hy + 8, wx + 8, 70, 0.28, false);
        windows.push({ u: (x0 + wx / 2) / w, v: 1 - (y1 + hy) / h, floor: f });
      }
      // occasional rust streak from ledge
      if ((seed + f) % 3 === 0) streaks(ctx, Math.random() * w * 0.8, y0 + FLOOR_PX - 6, 30, 90, 0.3, true);
    }

    // ---- ground floor ----
    const gy = h - FLOOR_PX;
    const [text, bg, fg] = SIGNS[seed % SIGNS.length];
    // sign board with panel joints and grime
    ctx.fillStyle = '#26221c'; ctx.fillRect(8, gy + 6, w - 16, 74); // frame shadow
    ctx.fillStyle = bg; ctx.fillRect(12, gy + 10, w - 24, 66);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
    for (let x = 12; x < w - 24; x += 96) { ctx.beginPath(); ctx.moveTo(x, gy + 10); ctx.lineTo(x, gy + 76); ctx.stroke(); }
    // painted hangul with offset shadow (hand-painted sign look)
    ctx.font = 'bold 52px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(text, w / 2 + 3, gy + 46);
    ctx.fillStyle = fg;
    ctx.fillText(text, w / 2, gy + 43);
    grime(ctx, w, gy + 80, 40, 0.15);
    streaks(ctx, 20, gy + 80, w - 40, 40, 0.22, true);

    // shopfront: glass or shutter
    if (seed % 3 === 0) {
      // steel shutter with rust
      ctx.fillStyle = '#77705f'; ctx.fillRect(16, gy + 92, w - 32, 150);
      for (let y = gy + 96; y < gy + 240; y += 12) {
        ctx.fillStyle = 'rgba(35,31,26,0.5)'; ctx.fillRect(16, y, w - 32, 3);
        ctx.fillStyle = 'rgba(255,250,235,0.08)'; ctx.fillRect(16, y + 6, w - 32, 2);
      }
      streaks(ctx, 30, gy + 92, w - 60, 130, 0.35, true);
      // dented bottom
      ctx.fillStyle = 'rgba(30,26,20,0.4)';
      ctx.fillRect(60, gy + 200, 90, 42); ctx.fillRect(300, gy + 210, 120, 32);
    } else {
      // display window + door, dark interior
      const g = ctx.createLinearGradient(0, gy + 92, 0, gy + 242);
      g.addColorStop(0, '#3c4245'); g.addColorStop(1, '#15181a');
      ctx.fillStyle = '#544d40'; ctx.fillRect(14, gy + 88, w - 28, 158); // frame
      ctx.fillStyle = g; ctx.fillRect(22, gy + 96, w - 130, 142);
      // shelf silhouettes inside
      ctx.fillStyle = 'rgba(90,80,60,0.25)';
      ctx.fillRect(40, gy + 150, 120, 10); ctx.fillRect(40, gy + 190, 160, 10);
      // reflection streak
      ctx.fillStyle = 'rgba(220,210,185,0.10)';
      ctx.beginPath(); ctx.moveTo(50, gy + 238); ctx.lineTo(140, gy + 96); ctx.lineTo(190, gy + 96); ctx.lineTo(100, gy + 238);
      ctx.closePath(); ctx.fill();
      // door
      ctx.fillStyle = '#2a2d2f'; ctx.fillRect(w - 100, gy + 96, 78, 142);
      ctx.strokeStyle = '#655d4e'; ctx.lineWidth = 4; ctx.strokeRect(w - 100, gy + 96, 78, 142);
      ctx.fillStyle = '#8d8471'; ctx.fillRect(w - 40, gy + 165, 10, 4); // handle
      // cracked glass
      ctx.strokeStyle = 'rgba(225,220,205,0.4)'; ctx.lineWidth = 1.5;
      const cx = 90 + Math.random() * 150, cy = gy + 130 + Math.random() * 70;
      for (let k = 0; k < 7; k++) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(k * 0.9) * (30 + Math.random() * 50), cy + Math.sin(k * 0.9) * (30 + Math.random() * 50));
        ctx.stroke();
      }
    }
    // torn posters on pillar edges
    for (const px of [2, w - 34]) {
      if (Math.random() < 0.7) {
        ctx.fillStyle = ['#c7b98f', '#b0a48a', '#8f9a8a'][seed % 3];
        ctx.fillRect(px, gy + 100 + Math.random() * 60, 32, 46);
        ctx.fillStyle = 'rgba(60,50,40,0.6)';
        for (let l = 0; l < 4; l++) ctx.fillRect(px + 4, gy + 110 + Math.random() * 80, 24, 2);
      }
    }
    // base scorch and dirt
    const sg = ctx.createLinearGradient(0, h - 70, 0, h);
    sg.addColorStop(0, 'rgba(25,20,16,0)'); sg.addColorStop(1, 'rgba(25,20,16,0.65)');
    ctx.fillStyle = sg; ctx.fillRect(0, h - 70, w, 70);
    grime(ctx, w, h, 240, 0.18);
  });
  const result = { tex, windows };
  facadeCache.set(key, result);
  return result;
}

let bseed = 3;
for (const side of [-1, 1]) {
  let z = 6;
  let lot = 0;
  while (z > -STREET_LENGTH) {
    const width = 10 + Math.random() * 6;
    // one collapsed lot per side, mid-street
    if (lot === 4) { addCollapsedLot(side, z, width); z -= width + 0.6; lot++; continue; }
    lot++;
    const floors = 1 + Math.floor(Math.random() * 2);
    const height = 4.6 + floors * 3.1;
    const depth = 8 + Math.random() * 4;
    const x = side * (STREET_WIDTH / 2 + 6 + depth / 2);
    const { tex, windows } = facade(floors, bseed++);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x968b78 });
    const faceMat = new THREE.MeshLambertMaterial({ map: tex });
    // BoxGeometry material order: [+x, -x, +y, -y, +z, -z]
    const mats = side === 1
      ? [wallMat, faceMat, wallMat, wallMat, wallMat, wallMat]
      : [faceMat, wallMat, wallMat, wallMat, wallMat, wallMat];
    const b = new THREE.Mesh(new THREE.BoxGeometry(depth, height, width), mats);
    b.position.set(x, height / 2, z - width / 2);
    b.castShadow = true; b.receiveShadow = true;
    world.add(b);

    const faceX = x - side * depth / 2; // street-facing wall plane

    // 3D ledges at floor lines
    for (let f = 1; f <= floors; f++) {
      const ly = height * (1 - f * (FLOOR_PX / (FLOOR_PX * (floors + 1))));
      const ledge = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, width * 0.98), curbMat);
      ledge.position.set(faceX - side * 0.1, ly, z - width / 2);

    // AC units under some upper windows
    for (const win of windows) {

      const ac = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.7), acMat);
      ac.position.set(faceX - side * 0.25, wy, side === 1 ? wz : z - win.u * width);

      aw.position.set(faceX - side * 0.9, 2.9, z - width / 2);
      aw.rotation.z = side * 0.28;
      aw.castShadow = true;
      world.add(aw);
    }
    // rooftop: parapet + water tank / antenna
    const parapet = new THREE.Mesh(new THREE.BoxGeometry(depth, 0.5, width),
      new THREE.MeshLambertMaterial({ color: 0x8a8070 }));
    parapet.position.set(x, height + 0.22, z - width / 2);

      mast.position.set(x + (Math.random() - 0.5) * 3, height + 1.5, z - width / 2);

        el.position.set(mast.position.x, height + 1.1 + a * 0.5, mast.position.z);

function addCar(x, z, rotY, color) {
  const car = new THREE.Group();

  const glassMat = new THREE.MeshPhongMaterial({ color: 0x1e2326, shininess: 60, transparent: true, opacity: 0.92 });

  // lower body
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.62, 1.82), bodyMat);
  body.position.y = 0.62; body.castShadow = true;
  // hood + trunk (lower than roof line)
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.26, 1.78), bodyMat);
  hood.position.set(1.5, 1.03, 0); hood.castShadow = true;
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.26, 1.78), bodyMat);
  trunk.position.set(-1.6, 1.03, 0); trunk.castShadow = true;
  // cabin glasshouse
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.52, 1.68), glassMat);
  cabin.position.set(-0.1, 1.38, 0);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.08, 1.72), bodyMat);
  roof.position.set(-0.1, 1.66, 0); roof.castShadow = true;
  // bumpers
  const bf = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 1.9), chromeMat);
  bf.position.set(2.28, 0.5, 0);
  const bb = bf.clone(); bb.position.x = -2.28;
  car.add(body, hood, trunk, cabin, roof, bf, bb);
  // wheels (slightly flat)
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
  const hubMat = new THREE.MeshPhongMaterial({ color: 0x777268, shininess: 40 });
  for (const [wx, wz] of [[-1.45, 0.95], [1.45, 0.95], [-1.45, -0.95], [1.45, -0.95]]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.26, 12), wheelMat);
    wheel.rotation.x = Math.PI / 2;
    wheel.scale.y = 0.94;
    wheel.position.set(wx, 0.33, wz);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.28, 8), hubMat);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(wx, 0.33, wz);
    car.add(wheel, hub);
  }
  car.position.set(x, 0, z);
  car.rotation.y = rotY;
  world.add(car);
  obstacles.push({ minX: x - 2.5, maxX: x + 2.5, minZ: z - 2.5, maxZ: z + 2.5 });
}

const shadowMat = new THREE.MeshLambertMaterial({ color: 0x080709 });
const shadowGlowTex = makeCanvas(64, 64, (ctx) => {
  const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, 'rgba(16,11,22,0.9)');
  g.addColorStop(1, 'rgba(16,11,22,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
});
const wispTex = makeCanvas(64, 64, (ctx) => {
  const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 28);
  g.addColorStop(0, 'rgba(14,10,20,0.7)');
  g.addColorStop(1, 'rgba(14,10,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
});

// pooled smoke wisps shed by creatures
const wisps = [];
function shedWisp(pos, scale) {
  if (wisps.length > 140) return;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: wispTex, transparent: true, opacity: 0.55, depthWrite: false,
    rotation: Math.random() * Math.PI * 2
  }));
  sp.position.copy(pos);
  sp.position.x += (Math.random() - 0.5) * 0.4;
  sp.position.z += (Math.random() - 0.5) * 0.4;
  sp.scale.setScalar(scale);
  sp.userData = { life: 0.9, vy: 0.5 + Math.random() * 0.6 };
  scene.add(sp);
  wisps.push(sp);
}

function makeShadowCreature() {
  const g = new THREE.Group();
  const mat = shadowMat.clone();
  // gaunt, hunched frame — long thin limbs
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.85, 0.24), mat);
  torso.position.y = 1.55;
  torso.rotation.x = 0.18;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), mat);
  head.position.set(0, 2.18, 0.08);
  head.scale.set(1, 1.5, 1.1);
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.25, 0.08), mat);
  armL.position.set(-0.32, 1.55, 0);
  armL.geometry.translate(0, -0.5, 0);
  const armR = armL.clone(); armR.position.x = 0.32;
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.11, 1.25, 0.11), mat);
  legL.position.set(-0.14, 1.2, 0);
  legL.geometry.translate(0, -0.55, 0);
  const legR = legL.clone(); legR.position.x = 0.14;
  const aura = new THREE.Sprite(new THREE.SpriteMaterial({
    map: shadowGlowTex, transparent: true, opacity: 0.85, depthWrite: false
  }));
  aura.position.y = 1.4;
  aura.scale.set(1.9, 2.8, 1);
  g.add(torso, head, armL, armR, legL, legR, aura);
  for (const m of [torso, head, armL, armR, legL, legR]) m.castShadow = true;
  g.userData = {
    mat, armL, armR, legL, legR,
    hp: 3, speed: 0, phase: Math.random() * Math.PI * 2,
    state: 'walk', attackCooldown: 0, dieT: 0, hitT: 0, wispT: 0,
  };
  for (const m of [torso, head, armL, armR, legL, legR]) {
    m.userData.enemy = g;
    m.userData.headshot = (m === head);
  }
  return g;
}

const enemies = [];
const enemyMeshes = [];

function spawnEnemy(wave) {
  const e = makeShadowCreature();
  const lane = (Math.random() - 0.5) * (STREET_WIDTH - 2);
  const z = camera.position.z - (60 + Math.random() * 60);
  e.position.set(lane, 0, Math.max(z, -STREET_LENGTH + 6));
  e.userData.hp = 3 + Math.floor(wave / 2);
  e.userData.speed = (1.6 + Math.random() * 0.8) * (1 + wave * 0.07);
  e.scale.setScalar(1.15 + Math.random() * 0.5);
  scene.add(e);
  enemies.push(e);
  e.traverse((m) => { if (m.isMesh) enemyMeshes.push(m); });
}

function removeEnemy(e) {
  scene.remove(e);
  enemies.splice(enemies.indexOf(e), 1);
  e.traverse((m) => {
    if (m.isMesh) {
      const i = enemyMeshes.indexOf(m);
      if (i >= 0) enemyMeshes.splice(i, 1);
    }
  });
}

// hit particles
const particles = [];
function burst(pos, color, n, speed) {
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(n * 3);
  const vel = [];
  for (let i = 0; i < n; i++) {
    arr[i * 3] = pos.x; arr[i * 3 + 1] = pos.y; arr[i * 3 + 2] = pos.z;
    vel.push(new THREE.Vector3(
      (Math.random() - 0.5) * speed,
      Math.random() * speed * 0.8,
      (Math.random() - 0.5) * speed
    ));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 0.09, transparent: true, opacity: 0.95, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData = { vel, life: 0.6 };
  scene.add(pts);
  particles.push(pts);
}

const tracers = [];
function tracer(from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xffd9a0, transparent: true, opacity: 0.9
  }));
  line.userData.life = 0.07;
  scene.add(line);
  tracers.push(line);
}

// ============================================================
// Post-processing: bloom + film grade (grain, vignette, warm tint)
// ============================================================
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.7, 0.86);
composer.addPass(bloom);

const gradePass = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      // gentle desaturation + warm dusty grade
      float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
      c.rgb = mix(vec3(l), c.rgb, 0.82);
      c.rgb *= vec3(1.05, 1.0, 0.92);
      c.rgb = (c.rgb - 0.5) * 1.07 + 0.5 + vec3(0.012, 0.008, 0.0);
      // vignette
      float d = distance(vUv, vec2(0.5));
      c.rgb *= 0.62 + 0.38 * smoothstep(0.92, 0.3, d);
      // animated film grain
      float g = hash(vUv * 900.0 + fract(uTime) * 37.0);
      c.rgb += (g - 0.5) * 0.045;
      gl_FragColor = c;
    }`
});
composer.addPass(gradePass);

// ============================================================
// Audio (synthesized — no assets)
// ============================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playGunshot() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const dur = 0.22;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(3000, t);
  lp.frequency.exponentialRampToValueAtTime(300, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(lp).connect(g).connect(audioCtx.destination);
  src.start(t);
}
function playClick(freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'square'; o.frequency.value = freq;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.07);
}
function playGrowl() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(90, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.5);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.55);
}

// ============================================================
// Player state / input
// ============================================================
const MAG_SIZE = 30;
const state = {
  running: false, over: false,
  yaw: 0, pitch: 0,
  keys: {},
  firing: false, fireTimer: 0, reloading: false, reloadT: 0,
  ammo: MAG_SIZE, reserve: 90,
  hp: 100, score: 0,
  wave: 0, pending: 0, waveDelay: 0,
  recoil: 0, bobT: 0, shake: 0,
};

const hud = document.getElementById('hud');
const startOverlay = document.getElementById('startOverlay');
const gameoverOverlay = document.getElementById('gameoverOverlay');
const elAmmo = document.getElementById('ammoCount');
const elReserve = document.getElementById('ammoReserve');
const elHealth = document.getElementById('healthFill');
const elWave = document.getElementById('waveNum');
const elScore = document.getElementById('score');
const elBanner = document.getElementById('waveBanner');
const elReloadHint = document.getElementById('reloadHint');
const elDamage = document.getElementById('damageFlash');
const elHitMarker = document.getElementById('hitMarker');

// rifle icon in ammo panel
{
  const ctx = document.getElementById('gunIcon').getContext('2d');
  ctx.fillStyle = '#d9d6cb';
  ctx.fillRect(6, 16, 56, 6);
  ctx.fillRect(62, 17, 26, 3);
  ctx.fillRect(10, 22, 10, 8);
  ctx.beginPath();
  ctx.moveTo(6, 16); ctx.lineTo(0, 26); ctx.lineTo(6, 26); ctx.closePath(); ctx.fill();
  ctx.fillRect(30, 10, 4, 6);
  ctx.fillRect(34, 22, 6, 6);
}

function updateHUD() {
  elAmmo.textContent = state.ammo;
  elReserve.textContent = '/ ' + state.reserve;
  elAmmo.style.color = state.ammo === 0 ? '#e05c3a' : '#e8e6dd';
  elHealth.style.width = Math.max(0, state.hp) + '%';
  elWave.textContent = state.wave;
  elScore.textContent = state.score;
  elReloadHint.style.display =
    (state.ammo <= 6 && state.reserve > 0 && !state.reloading) ? 'block' : 'none';
}

function showBanner(text) {
  elBanner.textContent = text;
  elBanner.style.opacity = 1;
  setTimeout(() => { elBanner.style.opacity = 0; }, 1800);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  resetGame(); startGame();
});

function startGame() {
  ensureAudio();
  if (state.wave === 0) nextWave();
  startOverlay.style.display = 'none';
  gameoverOverlay.style.display = 'none';
  hud.style.display = 'block';
  state.running = true;
  canvas.requestPointerLock();
}

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas && state.running && !state.over) {
    state.running = false;
    startOverlay.style.display = 'flex';
    document.getElementById('startBtn').textContent = '작 전 재 개';
  }
});

document.addEventListener('mousemove', (e) => {
  if (!state.running || document.pointerLockElement !== canvas) return;
  state.yaw -= e.movementX * 0.0022;
  state.pitch -= e.movementY * 0.0022;
  state.pitch = Math.max(-1.3, Math.min(1.3, state.pitch));
});
document.addEventListener('mousedown', (e) => {
  if (e.button === 0 && state.running) state.firing = true;
});
document.addEventListener('mouseup', (e) => {
  if (e.button === 0) state.firing = false;
});
document.addEventListener('keydown', (e) => {
  state.keys[e.code] = true;
  if (e.code === 'KeyR') tryReload();
});
document.addEventListener('keyup', (e) => { state.keys[e.code] = false; });

function tryReload() {
  if (state.reloading || state.ammo === MAG_SIZE || state.reserve === 0 || !state.running) return;
  state.reloading = true;
  state.reloadT = 1.6;
  playClick(320);
}

// ============================================================
// Shooting
// ============================================================
const raycaster = new THREE.Raycaster();
const FIRE_INTERVAL = 0.11;

function shoot() {
  if (state.ammo === 0) { playClick(180); state.firing = false; tryReload(); return; }
  state.ammo--;
  state.recoil = 1;
  state.shake = 0.6;
  playGunshot();
  muzzleFlash.material.opacity = 1;
  muzzleFlash.material.rotation = Math.random() * Math.PI * 2;
  muzzleLight.intensity = 3.5;

  const moving = state.keys['KeyW'] || state.keys['KeyA'] || state.keys['KeyS'] || state.keys['KeyD'];
  const spread = moving ? 0.02 : 0.008;
  const dir = new THREE.Vector3(
    (Math.random() - 0.5) * spread,
    (Math.random() - 0.5) * spread,
    -1
  ).unproject(camera).sub(camera.position).normalize();

  raycaster.set(camera.position, dir);
  raycaster.far = 200;
  const hits = raycaster.intersectObjects(enemyMeshes, false);
  const muzzleWorld = muzzleFlash.getWorldPosition(new THREE.Vector3());

  let endPoint = camera.position.clone().add(dir.clone().multiplyScalar(120));
  const live = hits.find(h => h.object.userData.enemy?.userData.state === 'walk');
  if (live) {
    endPoint = live.point;
    const e = live.object.userData.enemy;
    const dmg = live.object.userData.headshot ? 3 : 1;
    e.userData.hp -= dmg;
    e.userData.hitT = 0.15;
    burst(live.point, 0x2a1f3d, 16, 3.5);
    shedWisp(live.point, 0.8);
    elHitMarker.style.opacity = 1;
    setTimeout(() => { elHitMarker.style.opacity = 0; }, 90);
    if (e.userData.hp <= 0) {
      e.userData.state = 'dying';
      e.userData.dieT = 0.9;
      state.score++;
      playGrowl();
    }
  } else {
    burst(endPoint, 0x9a8f7a, 6, 2);
  }
  tracer(muzzleWorld, endPoint);
  updateHUD();
}

// ============================================================
// Waves
// ============================================================
function nextWave() {
  state.wave++;
  state.pending = 4 + state.wave * 2;
  state.waveDelay = 0;
  showBanner('WAVE ' + state.wave);
  playGrowl();
  updateHUD();
}

function resetGame() {
  for (const e of [...enemies]) removeEnemy(e);
  state.over = false;
  state.hp = 100; state.score = 0; state.wave = 0;
  state.ammo = MAG_SIZE; state.reserve = 90;
  state.reloading = false; state.firing = false;
  state.yaw = 0; state.pitch = 0;
  camera.position.set(0, PLAYER_HEIGHT, -6);
  nextWave();
}

function gameOver() {
  state.over = true;
  state.running = false;
  document.exitPointerLock();
  hud.style.display = 'none';
  document.getElementById('finalScore').textContent =
    `사살 ${state.score}  ·  도달 웨이브 ${state.wave}`;
  gameoverOverlay.style.display = 'flex';
}

// ============================================================
// Player collision
// ============================================================
function collidePlayer(pos) {
  const HALF = STREET_WIDTH / 2 + 5;
  pos.x = Math.max(-HALF, Math.min(HALF, pos.x));
  pos.z = Math.max(-STREET_LENGTH + 4, Math.min(2, pos.z));
  const R = 0.5;
  for (const o of obstacles) {
    if (pos.x > o.minX - R && pos.x < o.maxX + R && pos.z > o.minZ - R && pos.z < o.maxZ + R) {
      const dxMin = pos.x - (o.minX - R), dxMax = (o.maxX + R) - pos.x;
      const dzMin = pos.z - (o.minZ - R), dzMax = (o.maxZ + R) - pos.z;
      const m = Math.min(dxMin, dxMax, dzMin, dzMax);
      if (m === dxMin) pos.x = o.minX - R;
      else if (m === dxMax) pos.x = o.maxX + R;
      else if (m === dzMin) pos.z = o.minZ - R;
      else pos.z = o.maxZ + R;
    }
  }
}

// ============================================================
// Main loop
// ============================================================
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  gradePass.uniforms.uTime.value = t;

  // ambient motion always runs
  for (const sp of smokeSprites) {
    sp.position.y += sp.userData.speed * dt;
    sp.material.rotation += sp.userData.spin * dt;
    if (sp.position.y > sp.userData.baseY + 20) sp.position.y = sp.userData.baseY;
    sp.material.opacity = 0.55 * (1 - (sp.position.y - sp.userData.baseY) / 20);
  }
  for (const sp of hazeSprites) {
    sp.position.x += sp.userData.drift * dt;
    if (sp.position.x > 16) sp.position.x = -16;
  }
  dustPoints.rotation.y = Math.sin(t * 0.05) * 0.02;

  if (state.running && !state.over) {
    // --- movement ---
    const sprint = state.keys['ShiftLeft'] || state.keys['ShiftRight'];
    const speed = sprint ? 7.5 : 4.2;
    const fwd = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const move = new THREE.Vector3();
    if (state.keys['KeyW']) move.add(fwd);
    if (state.keys['KeyS']) move.sub(fwd);
    if (state.keys['KeyD']) move.add(right);
    if (state.keys['KeyA']) move.sub(right);
    const isMoving = move.lengthSq() > 0;
    if (isMoving) {
      move.normalize().multiplyScalar(speed * dt);
      camera.position.add(move);
      collidePlayer(camera.position);
      state.bobT += dt * (sprint ? 11 : 7.5);
    }

    const bobY = Math.sin(state.bobT * 2) * 0.025 * (isMoving ? 1 : 0);
    const shakeX = (Math.random() - 0.5) * 0.004 * state.shake;
    const shakeY = (Math.random() - 0.5) * 0.004 * state.shake;
    state.shake = Math.max(0, state.shake - dt * 4);
    camera.position.y = PLAYER_HEIGHT + bobY;
    camera.rotation.set(state.pitch + shakeY, state.yaw + shakeX, 0, 'YXZ');

    // --- firing ---
    state.fireTimer -= dt;
    if (state.firing && !state.reloading && state.fireTimer <= 0) {
      shoot();
      state.fireTimer = FIRE_INTERVAL;
    }
    muzzleFlash.material.opacity = Math.max(0, muzzleFlash.material.opacity - dt * 14);
    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 30);

    state.recoil = Math.max(0, state.recoil - dt * 7);
    gun.position.set(
      0.22 + Math.sin(state.bobT) * 0.006 * (isMoving ? 1 : 0),
      -0.2 + bobY * 0.5 + (state.reloading ? -0.12 : 0),
      -0.45 + state.recoil * 0.06
    );
    gun.rotation.x = state.recoil * 0.12 + (state.reloading ? -0.5 : 0);

    // --- reload ---
    if (state.reloading) {
      state.reloadT -= dt;
      if (state.reloadT <= 0) {
        const need = MAG_SIZE - state.ammo;
        const take = Math.min(need, state.reserve);
        state.ammo += take;
        state.reserve -= take;
        state.reloading = false;
        playClick(520);
        updateHUD();
      }
    }

    // --- wave spawning ---
    if (state.pending > 0) {
      state.waveDelay -= dt;
      if (state.waveDelay <= 0 && enemies.length < 8) {
        spawnEnemy(state.wave);
        state.pending--;
        state.waveDelay = 1.2 + Math.random() * 1.4;
      }
    } else if (state.pending === 0 && enemies.length === 0) {
      state.pending = -1; // guard: next wave is scheduled
      state.reserve += 30;
      showBanner('구역 확보');
      updateHUD();
      setTimeout(() => { if (!state.over) nextWave(); }, 2200);
    }

    // --- enemies ---
    for (const e of [...enemies]) {
      const u = e.userData;
      if (u.state === 'dying') {
        u.dieT -= dt;
        e.scale.y = Math.max(0.05, e.scale.y - dt * 1.6);
        e.position.y -= dt * 0.8;
        if (u.dieT < 0.4 && Math.random() < 0.6) {
          tmpV.copy(e.position); tmpV.y += 1;
          burst(tmpV, 0x1a1424, 6, 2.5);
          shedWisp(tmpV, 1.2);
        }
        if (u.dieT <= 0) removeEnemy(e);
        continue;
      }
      if (u.hitT > 0) {
        u.hitT -= dt;
        u.mat.color.setHex(0x4a2f6b);
      } else {
        u.mat.color.setHex(0x080709);
      }
      // shed drifting smoke while walking
      u.wispT -= dt;
      if (u.wispT <= 0) {
        u.wispT = 0.14 + Math.random() * 0.1;
        tmpV.copy(e.position);
        tmpV.y = 0.6 + Math.random() * 1.6;
        shedWisp(tmpV, 0.5 + Math.random() * 0.5);
      }
      tmpV.copy(camera.position).sub(e.position);
      tmpV.y = 0;
      const dist = tmpV.length();
      e.lookAt(camera.position.x, e.position.y, camera.position.z);
      if (dist > 1.6) {
        tmpV.normalize().multiplyScalar(u.speed * dt);
        e.position.add(tmpV);
        u.phase += dt * u.speed * 3.2;
        const s = Math.sin(u.phase);
        u.armL.rotation.x = s * 0.7;
        u.armR.rotation.x = -s * 0.7;
        u.legL.rotation.x = -s * 0.6;
        u.legR.rotation.x = s * 0.6;
      } else {
        u.attackCooldown -= dt;
        u.armL.rotation.x = -1.8; u.armR.rotation.x = -1.8;
        if (u.attackCooldown <= 0) {
          u.attackCooldown = 1.0;
          state.hp -= 12;
          playGrowl();
          elDamage.style.opacity = 1;
          setTimeout(() => { elDamage.style.opacity = 0; }, 350);
          state.shake = 1.2;
          updateHUD();
          if (state.hp <= 0) gameOver();
        }
      }
    }
  }

  // --- wisps / particles / tracers decay ---
  for (const sp of [...wisps]) {
    sp.userData.life -= dt;
    sp.position.y += sp.userData.vy * dt;
    sp.scale.multiplyScalar(1 + dt * 0.9);
    sp.material.opacity = 0.55 * Math.max(0, sp.userData.life / 0.9);
    if (sp.userData.life <= 0) { scene.remove(sp); wisps.splice(wisps.indexOf(sp), 1); }
  }
  for (const p of [...particles]) {
    p.userData.life -= dt;
    const arr = p.geometry.attributes.position.array;
    for (let i = 0; i < p.userData.vel.length; i++) {
      const v = p.userData.vel[i];
      arr[i * 3] += v.x * dt; arr[i * 3 + 1] += v.y * dt; arr[i * 3 + 2] += v.z * dt;
      v.y -= 6 * dt;
    }
    p.geometry.attributes.position.needsUpdate = true;
    p.material.opacity = Math.max(0, p.userData.life / 0.6);
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(particles.indexOf(p), 1); }
  }
  for (const l of [...tracers]) {
    l.userData.life -= dt;
    if (l.userData.life <= 0) { scene.remove(l); tracers.splice(tracers.indexOf(l), 1); }
  }

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

updateHUD();
animate();
</script>
</body>
</html>
