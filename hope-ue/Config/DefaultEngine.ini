[/Script/EngineSettings.GameMapsSettings]
; The level is built entirely in C++ at BeginPlay, so any empty map works.
; Tools/build_content.py creates /Game/Maps/Street; until then the editor
; opens its own default map and the game still builds the street itself.
EditorStartupMap=/Game/Maps/Street.Street
GameDefaultMap=/Game/Maps/Street.Street
GlobalDefaultGameMode=/Script/HopeLastStreet.HopeGameMode

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; ----------------------------------------------------------------------------
; Renderer — this block is the reason the project exists. Everything here is a
; capability the WebGL build could not reach.
; ----------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
; Lumen: real-time global illumination and reflections. Replaces the baked
; PMREM environment probe the browser build used, and gives true bounce light
; into the shop interiors and under the awnings.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenTracingSource=1
r.RayTracing=True
r.RayTracing.Shadows=1
r.SkinCache.CompileShaders=True
r.RayTracing.UseTextureLod=True

; Virtual shadow maps — replaces the cascaded shadow maps, with far higher
; resolution contact shadows on the officer and the debris.
r.Shadow.Virtual.Enable=1

; Nanite: lets scan-based (Megascans) geometry drop straight in without a
; polygon budget. Required for the asset swap described in the README.
r.Nanite=True
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2

; TSR — the temporal upscaler. Strictly better than the SMAA pass in the
; browser build, and it is what makes the volumetric fog resolve cleanly.
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.ScreenPercentage=100

; Virtual textures, so 8K Megascans sets stream instead of loading whole.
r.VirtualTextures=1
r.VirtualTexturedLightmaps=1
r.Streaming.PoolSize=3000

; Volumetrics and camera behaviour for the dust-haze look of the film still.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4
r.VolumetricFog.GridSizeZ=128
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.LensFlare=False
r.MotionBlurQuality=4
r.BloomQuality=5
r.Tonemapper.Quality=5
r.Shadow.CSM.MaxCascades=4
r.AllowStaticLighting=False

[/Script/Engine.Engine]
bSmoothFrameRate=False
NearClipPlane=5.0

