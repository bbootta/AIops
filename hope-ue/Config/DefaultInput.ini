; Axis/action mappings rather than Enhanced Input, deliberately: Enhanced Input
; needs UInputAction and UInputMappingContext *assets*, and .uasset files are
; binary — they cannot be authored outside the editor. This keeps the project
; runnable straight from a git clone with no content-generation step.
; Swap to Enhanced Input in the editor if you prefer; nothing else depends on it.
[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)

+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Aim",Key=RightMouseButton)
+ActionMappings=(ActionName="Reload",Key=R)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Restart",Key=SpaceBar)
