<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8DF7"/>
      <stop offset="1" stop-color="#7C4DF0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1A1A4E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS 스타일 라운드 스퀘어 배경 -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="184" fill="url(#shine)"/>

  <!-- 돋보기 -->
  <g filter="url(#soft)">
    <circle cx="466" cy="446" r="178" fill="none" stroke="#FFFFFF" stroke-width="52"/>
    <line x1="597" y1="577" x2="728" y2="708" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  </g>

  <!-- 렌즈 안 번개: 속도 -->
  <path d="M 497 330 L 391 480 L 456 480 L 430 564 L 540 420 L 473 420 Z" fill="#FFD60A"/>
</svg>
