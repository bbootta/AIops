[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-team-agent"
version = "0.1.0"
description = "Agentic Harness for bank risk model validation team"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "jsonschema>=4.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["tools*", "middleware*", "vta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 기본 (E4/E7/E9/F) + 모호한 변수명. v1 전체가 이미 clean.
extend-select = ["E741"]

[tool.mypy]
mypy_path = "src"
python_version = "3.10"

# v2 (vta.core / vta.policies) 만 strict — v1 은 점진 적용 (docs/v2_refactor_plan.md 5절)
[[tool.mypy.overrides]]
module = ["vta.core.*", "vta.policies.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tools.*", "middleware.*", "vta.domains.*", "vta.handlers.*", "vta.cli.*", "vta.reports.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "jsonschema", "numpy.*", "scipy.*", "sklearn.*", "statsmodels.*"]
ignore_missing_imports = true
